<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公文格式转换器</title>
    <meta name="description" content="Markdown转标准公文格式，符合GB/T 9704-2012标准">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #007AFF;
            --success-color: #34C759;
            --error-color: #FF3B30;
            --bg-primary: #FFFFFF;
            --bg-secondary: #F9F9FB;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --border-color: #E5E5E7;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", 
                         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg-secondary);
            min-height: 100vh;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            padding: 60px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 36px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 40px;
            align-items: start;
        }

        .main-content {
            background: var(--bg-primary);
            border-radius: 12px;
            padding: 32px;
            border: 1px solid var(--border-color);
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            padding: 12px 24px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }

        .tab:hover {
            color: var(--text-primary);
        }

        .tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            background: var(--bg-secondary);
            transition: all 0.2s ease;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
            background: rgba(0, 122, 255, 0.03);
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            opacity: 0.5;
        }

        .upload-text {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .upload-hint {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .file-input {
            display: none;
        }

        textarea {
            width: 100%;
            min-height: 400px;
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            font-family: 'SF Mono', 'Monaco', 'Menlo', monospace;
            resize: vertical;
            transition: border-color 0.2s ease;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            background: var(--bg-primary);
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #0051D5;
        }

        .btn-primary:disabled {
            background: var(--border-color);
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #F0F0F2;
        }

        .selected-file {
            margin-top: 16px;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
            font-size: 14px;
        }

        .remove-file {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            font-size: 18px;
            line-height: 1;
        }

        .remove-file:hover {
            color: var(--error-color);
        }

        .status-message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .status-message.success {
            background: rgba(52, 199, 89, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(52, 199, 89, 0.2);
            display: block;
        }

        .status-message.error {
            background: rgba(255, 59, 48, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(255, 59, 48, 0.2);
            display: block;
        }

        .status-message.loading {
            background: rgba(0, 122, 255, 0.1);
            color: var(--primary-color);
            border: 1px solid rgba(0, 122, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(0, 122, 255, 0.3);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sidebar {
            position: sticky;
            top: 60px;
        }

        .sidebar h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }

        .syntax-list {
            list-style: none;
            padding: 0;
        }

        .syntax-list li {
            padding: 8px 0;
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.4;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .syntax-list li:last-child {
            border-bottom: none;
        }

        .syntax-list code {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 12px;
            color: var(--primary-color);
        }

        .syntax-list .arrow {
            color: var(--text-secondary);
            margin: 0 6px;
        }

        .footer {
            text-align: center;
            margin-top: 60px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
        }

        .footer p {
            color: var(--text-secondary);
            font-size: 13px;
            line-height: 1.8;
        }

        .footer a {
            color: var(--primary-color);
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 1024px) {
            .main-layout {
                grid-template-columns: 1fr;
                gap: 32px;
            }

            .sidebar {
                position: static;
                background: var(--bg-primary);
                border-radius: 12px;
                padding: 24px;
                border: 1px solid var(--border-color);
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 40px 16px;
            }

            .header h1 {
                font-size: 28px;
            }

            .main-content {
                padding: 24px;
            }

            .button-group {
                flex-direction: column;
            }

            textarea {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>公文格式转换器</h1>
            <p>Markdown 转标准公文格式 · 符合 GB/T 9704-2012 标准</p>
        </div>

        <div class="main-layout">
            <div class="main-content">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('upload')">上传文件</button>
                    <button class="tab" onclick="switchTab('text')">粘贴文本</button>
                </div>

                <!-- 上传文件 -->
                <div id="upload-tab" class="tab-content active">
                    <div class="upload-area" id="uploadArea">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                        </svg>
                        <div class="upload-text">点击选择或拖拽文件到此处</div>
                        <div class="upload-hint">支持 .md、.txt、.docx 格式</div>
                        <input type="file" id="fileInput" class="file-input" accept=".md,.markdown,.txt,.docx">
                    </div>

                    <div id="selectedFile" class="selected-file" style="display: none;">
                        <div class="file-info">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/>
                                <polyline points="13 2 13 9 20 9"/>
                            </svg>
                            <span id="fileName"></span>
                        </div>
                        <button class="remove-file" onclick="removeFile()">×</button>
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary" id="convertFileBtn" onclick="convertFile()" disabled>
                            转换并下载
                        </button>
                    </div>
                </div>

                <!-- 粘贴文本 -->
                <div id="text-tab" class="tab-content">
                    <textarea id="markdownText" placeholder="在此粘贴或输入 Markdown 文本...

示例：
# 关于加强公文格式管理的通知

## 总体要求

各单位要高度重视公文格式规范化工作，严格按照标准执行。

## 具体措施

### 字体要求

正文采用**仿宋_GB2312字体**，字号为三号（16磅）。

注：标题会自动添加序号"></textarea>

                    <div class="button-group">
                        <button class="btn btn-secondary" onclick="clearText()">清空</button>
                        <button class="btn btn-primary" onclick="convertText()">转换并下载</button>
                    </div>
                </div>

                <div id="statusMessage" class="status-message"></div>
            </div>

            <aside class="sidebar">
                <h3>支持的 Markdown 语法</h3>
                <ul class="syntax-list">
                    <li><code>#</code><span class="arrow">→</span>主标题（小标宋 22磅 居中）</li>
                    <li><code>##</code><span class="arrow">→</span>一级标题（黑体 16磅，序号：一、二）</li>
                    <li><code>###</code><span class="arrow">→</span>二级标题（楷体 16磅，序号：（一））</li>
                    <li><code>####</code><span class="arrow">→</span>三级标题（楷体 16磅，序号：1.）</li>
                    <li><code>**文本**</code><span class="arrow">→</span>加粗</li>
                    <li><code>*文本*</code><span class="arrow">→</span>斜体</li>
                    <li><code>- 项目</code><span class="arrow">→</span>列表项</li>
                </ul>
            </aside>
        </div>

        <div class="footer">
            <p>完全免费 · 前端托管在 Vercel · 后端 API 在 Render</p>
            <p><a href="https://github.com/liusai0820/md2govdoc" target="_blank">GitHub 源码</a></p>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000'
            : 'https://md2govdoc-api.onrender.com';

        let selectedFile = null;

        // 从Content-Disposition头中提取文件名
        function extractFilename(contentDisposition) {
            if (!contentDisposition) return '公文格式文档.docx';
            
            // 优先匹配 filename*=UTF-8''xxx 格式（RFC 5987）
            const utf8Match = contentDisposition.match(/filename\*=UTF-8''([^;]+)/);
            if (utf8Match && utf8Match[1]) {
                return decodeURIComponent(utf8Match[1]);
            }
            
            // 其次匹配 filename="xxx" 或 filename=xxx 格式
            const normalMatch = contentDisposition.match(/filename=["']?([^;"']+)["']?/);
            if (normalMatch && normalMatch[1]) {
                return normalMatch[1];
            }
            
            return '公文格式文档.docx';
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + '-tab').classList.add('active');
            
            hideStatus();
        }

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--primary-color)';
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.style.borderColor = 'var(--border-color)';
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.style.borderColor = 'var(--border-color)';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        function handleFileSelect(file) {
            selectedFile = file;
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('selectedFile').style.display = 'flex';
            document.getElementById('convertFileBtn').disabled = false;
            hideStatus();
        }

        function removeFile() {
            selectedFile = null;
            fileInput.value = '';
            document.getElementById('selectedFile').style.display = 'none';
            document.getElementById('convertFileBtn').disabled = true;
        }

        function clearText() {
            document.getElementById('markdownText').value = '';
            hideStatus();
        }

        function showStatus(message, type) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.innerHTML = type === 'loading' 
                ? `<div class="spinner"></div><span>${message}</span>`
                : message;
            statusEl.className = 'status-message ' + type;
        }

        function hideStatus() {
            const statusEl = document.getElementById('statusMessage');
            statusEl.className = 'status-message';
        }

        async function convertFile() {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);

            showStatus('正在转换中，请稍候...', 'loading');

            try {
                const response = await fetch(`${API_BASE_URL}/api/convert`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let filename = '公文格式文档.docx';
                    
                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename\*?=['"]?(?:UTF-\d['"]*)?([^;\r\n"']*)['"]?;?/);
                        if (filenameMatch && filenameMatch[1]) {
                            filename = decodeURIComponent(filenameMatch[1]);
                        }
                    }

                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);

                    showStatus('转换成功，文件已开始下载', 'success');
                } else {
                    const error = await response.json();
                    showStatus(error.error || '转换失败', 'error');
                }
            } catch (error) {
                showStatus('网络错误：' + error.message, 'error');
            }
        }

        async function convertText() {
            const text = document.getElementById('markdownText').value.trim();
            
            if (!text) {
                showStatus('请输入 Markdown 文本', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('text', text);

            showStatus('正在转换中，请稍候...', 'loading');

            try {
                const response = await fetch(`${API_BASE_URL}/api/convert`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const contentDisposition = response.headers.get('Content-Disposition');
                    let filename = '公文格式文档.docx';
                    
                    if (contentDisposition) {
                        const filenameMatch = contentDisposition.match(/filename\*?=['"]?(?:UTF-\d['"]*)?([^;\r\n"']*)['"]?;?/);
                        if (filenameMatch && filenameMatch[1]) {
                            filename = decodeURIComponent(filenameMatch[1]);
                        }
                    }

                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);

                    showStatus('转换成功，文件已开始下载', 'success');
                } else {
                    const error = await response.json();
                    showStatus(error.error || '转换失败', 'error');
                }
            } catch (error) {
                showStatus('网络错误：' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
